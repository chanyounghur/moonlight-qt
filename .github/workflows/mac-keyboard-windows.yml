name: Mac keyboard - Windows x64

on:
  push:
    branches: [feature/mac-keyboard]
  pull_request:
    branches: [feature/mac-keyboard]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test key state transitions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/keymapper_test.cpp -o /tmp/keymapper-test
          /tmp/keymapper-test

  windows:
    needs: test
    runs-on: windows-2025
    env:
      CI_VERSION: mac-keyboard-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Download upstream dependencies
        run: ./setup-deps.ps1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          cache: true
          set-env: false
          add-tools-to-path: false
          tools: tools_qtcreator_gui
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'
      - name: Test native Caps Lock and Korean modifier isolation
        shell: cmd
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\6.12.0\msvc2022_64\bin
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\test-windows-input.bat
      - name: Build Windows x64
        shell: cmd
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\6.12.0\msvc2022_64\bin
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
      - name: Package Mac keyboard profile
        shell: pwsh
        run: |
          Copy-Item config/mac-keyboard.json build/deploy-x64-release/mac-keyboard.json
          Copy-Item docs/MAC-KEYBOARD.md build/deploy-x64-release/MAC-KEYBOARD.md
          # Reuse the installed client's settings and pairing certificates.
          if (Test-Path build/deploy-x64-release/portable.dat) {
            Remove-Item -LiteralPath build/deploy-x64-release/portable.dat
          }
          git rev-parse HEAD | Out-File build/deploy-x64-release/source-commit.txt -Encoding utf8
      - name: Upload build using existing settings
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-MacKeyboard-Windows-x64-${{ github.run_number }}
          path: build/deploy-x64-release/*
          if-no-files-found: error
          retention-days: 30
