name: Mac keyboard - Windows x64

on:
  push:
    branches: [feature/mac-keyboard]
  pull_request:
    branches: [feature/mac-keyboard]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test key state transitions
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/keymapper_test.cpp -o /tmp/keymapper-test
          /tmp/keymapper-test

  windows:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI_VERSION: mac-keyboard-${{ github.run_number }}
      MAC_KEYBOARD_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Download upstream dependencies
        run: ./setup-deps.ps1
      - name: Test keyboard helper, ordered input, and foreground isolation
        shell: cmd
        run: scripts\test-windows-input.bat
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          cache: true
          set-env: false
          add-tools-to-path: false
          tools: tools_qtcreator_gui
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'
      - name: Build Windows x64
        shell: cmd
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\6.12.0\msvc2022_64\bin
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
      - name: Build x64 setup with runtime prerequisites
        shell: cmd
        run: scripts\build-mac-keyboard-setup.bat
      - name: Test official upgrade and clean installation
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/test-mac-keyboard-installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-MacKeyboard-Installer-x64-${{ github.run_number }}
          path: |
            build/installer-x64-release/Moonlight-MacKeyboard-v5-x64-Setup.exe
            build/deploy-x64-release/source-commit.txt
            build/deploy-x64-release/MAC-KEYBOARD.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Installer-diagnostics-${{ github.run_number }}
          path: |
            build/installer-tests/*.log
            build/installer-x64-release/Moonlight-MacKeyboard-v5-x64-Setup.exe
            build/deploy-x64-release/source-commit.txt
          if-no-files-found: ignore
